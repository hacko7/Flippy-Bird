<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACKO Movies</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #fff; padding-bottom: 50px; }
    
    header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 24px; color: #38bdf8; letter-spacing: 1px; cursor: pointer; }
    .nav-btns { display: flex; gap: 10px; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #0284c7; color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-secondary:hover { background: #475569; }

    /* Hero Banner */
    .hero-banner { position: relative; width: 100%; height: 350px; background: #1e293b; overflow: hidden; display: flex; align-items: flex-end; }
    .hero-bg { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; opacity: 0.4; filter: blur(2px); }
    .hero-content { position: relative; z-index: 2; padding: 30px; background: linear-gradient(to top, rgba(15,23,42,1), transparent); width: 100%; }
    .hero-title { font-size: 32px; font-weight: bold; margin-bottom: 10px; color: #fff; }

    /* Controls Container */
    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
    .controls { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 25px; }
    .search-input, .filter-select { padding: 12px 15px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 15px; outline: none; }
    .search-input { flex: 1; min-width: 200px; }

    /* Movie Cards Grid */
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
    .movie-card { background: #1e293b; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #334155; position: relative; }
    .movie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
    .movie-card img { width: 100%; height: 230px; object-fit: cover; }
    .movie-info { padding: 12px; text-align: center; }
    .movie-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-genre { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    /* Watchlist Badge */
    .watchlist-btn { position: absolute; top: 10px; right: 10px; background: rgba(15,23,42,0.8); border: none; color: #fff; padding: 6px 10px; border-radius: 20px; font-size: 12px; cursor: pointer; backdrop-filter: blur(4px); }

    /* Modal / Player Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; width: 90%; max-width: 800px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #334155; max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 10px; right: 15px; color: #fff; font-size: 28px; cursor: pointer; z-index: 10; }
    
    .player-container { width: 100%; height: 400px; background: #000; position: relative; }
    .player-container img { width: 100%; height: 100%; object-fit: contain; }
    .player-container iframe { width: 100%; height: 100%; border: none; display: none; }

    .modal-details { padding: 20px; }
    .play-btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; }
    .play-btn:hover { background: #0284c7; color: #fff; }

    /* Admin Form Styling */
    .admin-form { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .admin-form input, .admin-form select { padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
  </style>
</head>
<body>

  <header>
    <h1 onclick="showAllMovies()">HACKO MOVIES</h1>
    <div class="nav-btns">
      <button class="btn btn-secondary" onclick="showWatchlist()">Watchlist (<span id="watchCount">0</span>)</button>
      <button class="btn" onclick="openAdminModal()">Admin Panel</button>
    </div>
  </header>

  <!-- Dynamic Featured Banner -->
  <div class="hero-banner" id="heroBanner" style="display: none;">
    <img id="heroBg" class="hero-bg" src="" alt="Hero Banner">
    <div class="hero-content">
      <div class="hero-title" id="heroTitle"></div>
      <button class="btn" id="heroPlayBtn">Watch Now</button>
    </div>
  </div>

  <div class="container">
    <!-- Controls Section -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search movies..." oninput="filterMovies()">
      <select id="genreFilter" class="filter-select" onchange="filterMovies()">
        <option value="All">All Genres</option>
        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Drama">Drama</option>
        <option value="Sci-Fi">Sci-Fi</option>
      </select>
    </div>

    <!-- Movie Grid -->
    <div class="movie-grid" id="movieGrid"></div>
  </div>

  <!-- Movie Player Modal -->
  <div class="modal" id="movieModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      
      <div class="player-container">
        <img id="modalImage" src="" alt="Movie Poster">
        <iframe id="modalTrailerFrame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
      </div>

      <div class="modal-details">
        <h2 id="modalTitle">Movie Title</h2>
        <p id="modalGenre" style="color: #94a3b8; margin-top: 5px;"></p>
        <button class="play-btn" onclick="openLink()">Watch Movie Inside Player</button>
      </div>
    </div>
  </div>

  <!-- Admin Panel Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeAdminModal()">&times;</span>
      <div class="admin-form">
        <h2>Add / Update Movie</h2>
        <input type="text" id="adminTitle" placeholder="Movie Title">
        <input type="text" id="adminPoster" placeholder="Poster Image URL">
        <input type="text" id="adminGenre" placeholder="Genre (e.g. Action)">
        <input type="text" id="adminTerabox" placeholder="Telegram Video File ID">
        <button class="btn" onclick="addMovieToDatabase()">Save Movie</button>
      </div>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://ubgozfincybhmdzstgdh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViZ296ZmluY3liaG1kenN0Z2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNDc1MjksImV4cCI6MjEwMTgyMzUyOX0.5fQKsV3tv9x76aQ6pB9IQ85SBPtPOszWy8Or-RJD41A";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let moviesData = [];
    let selectedMovie = null;
    let watchlist = JSON.parse(localStorage.getItem("hacko_watchlist")) || [];

    // Fetch Movies from Supabase
    async function fetchMovies() {
      const { data, error } = await supabase.from('movies').select('*').order('id', { ascending: false });
      if (error) {
        console.error("Error loading movies:", error);
        return;
      }
      moviesData = data || [];
      renderMovies(moviesData);
      setupHeroBanner();
      updateWatchlistCount();
    }

    // Render Grid
    function renderMovies(data) {
      const grid = document.getElementById("movieGrid");
      grid.innerHTML = "";

      if(data.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">No movies found.</p>`;
        return;
      }

      data.forEach(movie => {
        const isWatchlisted = watchlist.some(m => m.id === movie.id);
        const card = document.createElement("div");
        card.className = "movie-card";
        card.innerHTML = `
          <button class="watchlist-btn" onclick="toggleWatchlist(event, ${movie.id})">
            ${isWatchlisted ? '✓ Saved' : '+ Watchlist'}
          </button>
          <img src="${movie.poster || 'https://via.placeholder.com/300x450'}" alt="${movie.title}" onclick="openModal(${movie.id})">
          <div class="movie-info" onclick="openModal(${movie.id})">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-genre">${movie.genre || ''}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter Logic
    function filterMovies() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const selectedGenre = document.getElementById("genreFilter").value;

      const filtered = moviesData.filter(movie => {
        const matchesSearch = movie.title.toLowerCase().includes(query);
        const matchesGenre = selectedGenre === "All" || (movie.genre && movie.genre.includes(selectedGenre));
        return matchesSearch && matchesGenre;
      });

      renderMovies(filtered);
    }

    // Hero Banner Setup
    function setupHeroBanner() {
      if(moviesData.length > 0) {
        const featured = moviesData[0];
        document.getElementById("heroBanner").style.display = "flex";
        document.getElementById("heroBg").src = featured.poster;
        document.getElementById("heroTitle").innerText = featured.title;
        document.getElementById("heroPlayBtn").onclick = () => openModal(featured.id);
      }
    }

    // Open Player Modal
    function openModal(movieId) {
      selectedMovie = moviesData.find(m => m.id === movieId);
      if(!selectedMovie) return;

      document.getElementById("modalTitle").innerText = selectedMovie.title;
      document.getElementById("modalGenre").innerText = selectedMovie.genre || '';
      document.getElementById("modalImage").src = selectedMovie.poster;
      
      document.getElementById("modalImage").style.display = "block";
      const iframe = document.getElementById("modalTrailerFrame");
      iframe.style.display = "none";
      iframe.src = "";

      document.getElementById("movieModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("movieModal").style.display = "none";
      const iframe = document.getElementById("modalTrailerFrame");
      iframe.src = "";
    }

    // Vercel Streamer Video Player Link Update
    function openLink() {
      if (!selectedMovie || !selectedMovie.terabox_url) {
        alert("No video File ID available for this movie.");
        return;
      }

      const fileId = selectedMovie.terabox_url.trim();
      const iframeElement = document.getElementById("modalTrailerFrame");
      const imgElement = document.getElementById("modalImage");

      const embedUrl = `https://tg-streamer.vercel.app/embed/${fileId}`;

      imgElement.style.display = "none";
      iframeElement.style.display = "block";

      iframeElement.setAttribute("allow", "autoplay; encrypted-media; fullscreen");
      iframeElement.setAttribute("allowfullscreen", "true");
      iframeElement.src = embedUrl;
    }

    // Watchlist Logic
    function toggleWatchlist(e, movieId) {
      e.stopPropagation();
      const movie = moviesData.find(m => m.id === movieId);
      const index = watchlist.findIndex(m => m.id === movieId);

      if (index > -1) {
        watchlist.splice(index, 1);
      } else {
        watchlist.push(movie);
      }

      localStorage.setItem("hacko_watchlist", JSON.stringify(watchlist));
      updateWatchlistCount();
      filterMovies();
    }

    function updateWatchlistCount() {
      document.getElementById("watchCount").innerText = watchlist.length;
    }

    function showWatchlist() {
      renderMovies(watchlist);
    }

    function showAllMovies() {
      renderMovies(moviesData);
    }

    // Admin Panel Actions
    function openAdminModal() { document.getElementById("adminModal").style.display = "flex"; }
    function closeAdminModal() { document.getElementById("adminModal").style.display = "none"; }

    async function addMovieToDatabase() {
      const title = document.getElementById("adminTitle").value;
      const poster = document.getElementById("adminPoster").value;
      const genre = document.getElementById("adminGenre").value;
      const fileId = document.getElementById("adminTerabox").value;

      if(!title || !fileId) {
        alert("Title and Telegram File ID are required!");
        return;
      }

      const { data, error } = await supabase.from('movies').insert([
        { title: title, poster: poster, genre: genre, terabox_url: fileId }
      ]);

      if(error) {
        alert("Error adding movie: " + error.message);
      } else {
        alert("Movie added successfully!");
        closeAdminModal();
        fetchMovies();
      }
    }

    // Initial Load
    fetchMovies();
  </script>
</body>
</html>
