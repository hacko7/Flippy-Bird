<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACKO Movies</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #fff; padding-bottom: 50px; }
    
    header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    header h1 { font-size: 24px; color: #38bdf8; letter-spacing: 1px; }

    .search-bar { padding: 15px 20px; background: #1e293b; display: flex; justify-content: center; border-bottom: 1px solid #334155; }
    .search-bar input { width: 100%; max-width: 600px; padding: 10px 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; outline: none; }

    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }

    /* Movie Cards */
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-top: 20px; }
    .movie-card { background: #1e293b; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s; border: 1px solid #334155; }
    .movie-card:hover { transform: translateY(-5px); }
    .movie-card img { width: 100%; height: 230px; object-fit: cover; }
    .movie-info { padding: 10px; text-align: center; }
    .movie-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Modal / Player Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; width: 90%; max-width: 800px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #334155; }
    .close-btn { position: absolute; top: 10px; right: 15px; color: #fff; font-size: 28px; cursor: pointer; z-index: 10; }
    
    .player-container { width: 100%; height: 400px; background: #000; position: relative; }
    .player-container img { width: 100%; height: 100%; object-fit: contain; }
    .player-container iframe { width: 100%; height: 100%; border: none; display: none; }

    .modal-details { padding: 20px; }
    .play-btn { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; transition: background 0.3s; }
    .play-btn:hover { background: #0284c7; color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>HACKO MOVIES</h1>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="filterMovies()">
  </div>

  <div class="container">
    <div class="movie-grid" id="movieGrid">
      <!-- Dynamic Movies list generated via JS -->
    </div>
  </div>

  <!-- Movie Player Modal -->
  <div class="modal" id="movieModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      
      <div class="player-container">
        <img id="modalImage" src="" alt="Movie Poster">
        <iframe id="modalTrailerFrame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
      </div>

      <div class="modal-details">
        <h2 id="modalTitle">Movie Title</h2>
        <button class="play-btn" onclick="openLink()">Watch Movie Inside Player</button>
      </div>
    </div>
  </div>

  <script>
    // మీ ఒరిజినల్ మూవీస్ డేటా 
    const moviesData = [
      {
        id: 1,
        title: "Spider-Man",
        poster: "https://image.tmdb.org/t/p/w500/gh4cZbhZxyTbgxQPXD0dOudNPTn.jpg", // ఒరిజినల్ పోస్టర్ లింక్
        terabox_url: "BAACAgUAAxkBAAEt5M9qiayD4fTdxhRzGWUuPhu84B_xAAGcx4AAm-vSVSqmjOwVjK5BDOE" // Telegram File ID
      }
    ];

    let selectedMovie = null;

    // Load Movies onto page
    function loadMovies(data = moviesData) {
      const grid = document.getElementById("movieGrid");
      grid.innerHTML = "";
      
      if(data.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #94a3b8;'>No movies found.</p>";
        return;
      }

      data.forEach(movie => {
        const card = document.createElement("div");
        card.className = "movie-card";
        card.onclick = () => openModal(movie);
        card.innerHTML = `
          <img src="${movie.poster}" alt="${movie.title}">
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Search Filter Function
    function filterMovies() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = moviesData.filter(movie => movie.title.toLowerCase().includes(query));
      loadMovies(filtered);
    }

    // Open Movie Modal
    function openModal(movie) {
      selectedMovie = movie;
      document.getElementById("modalTitle").innerText = movie.title;
      document.getElementById("modalImage").src = movie.poster;
      
      // Reset Player state
      document.getElementById("modalImage").style.display = "block";
      const iframe = document.getElementById("modalTrailerFrame");
      iframe.style.display = "none";
      iframe.src = "";

      document.getElementById("movieModal").style.display = "flex";
    }

    // Close Modal
    function closeModal() {
      document.getElementById("movieModal").style.display = "none";
      const iframe = document.getElementById("modalTrailerFrame");
      iframe.src = "";
    }

    // STREAMING FUNCTION (Vercel Telegram Streamer Support)
    function openLink() {
      if (!selectedMovie || !selectedMovie.terabox_url) {
        alert("No video File ID available.");
        return;
      }

      // Telegram File ID
      const fileId = selectedMovie.terabox_url.trim(); 
      const iframeElement = document.getElementById("modalTrailerFrame");
      const imgElement = document.getElementById("modalImage");

      // Vercel Streamer Embed URL
      const embedUrl = `https://tg-streamer.vercel.app/embed/${fileId}`;

      // Poster దాచి Iframe ని చూపించడం
      imgElement.style.display = "none";
      iframeElement.style.display = "block";

      iframeElement.setAttribute("allow", "autoplay; encrypted-media; fullscreen");
      iframeElement.setAttribute("allowfullscreen", "true");
      
      // Stream URL ని Iframe కి పంపడం
      iframeElement.src = embedUrl;
    }

    // Initialize Page
    loadMovies();
  </script>
</body>
</html>
